<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline - Mondo</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f6f7fb;color:#12151f;text-align:center;padding:24px}
  main{max-width:360px}
  .m{width:64px;height:64px;border-radius:16px;background:#2554e8;margin:0 auto 20px;display:grid;place-items:center}
  svg{width:34px;height:34px}
  h1{font-size:1.3rem;margin:0 0 8px}
  p{margin:0 0 20px;color:#555b6e;line-height:1.5}
  button{border:0;border-radius:12px;padding:12px 22px;font-size:1rem;font-weight:600;color:#fff;background:linear-gradient(135deg,#2554e8,#ff4b33);cursor:pointer}
  @media (prefers-color-scheme:dark){body{background:#0e1118;color:#f1f3f9}p{color:#a7adbf}}
</style>
</head>
<body>
<main>
  <div class="m"><svg viewBox="0 0 64 64" aria-hidden="true"><path d="M2 58V6h12l18 30L50 6h12v52H50V27L35 52h-6L14 27v31z" fill="#fff"/></svg></div>
  <h1>You are offline</h1>
  <p>Mondo needs an internet connection to show your balance and make payments safely. Check your connection and try again.</p>
  <button onclick="location.reload()">Try again</button>
</main>
</body>
</html>
